# Configuration for testing the missing-Gateway guard: no kind: Gateway document is present.
# This exercises the gateways[0] dereference at run.go:334 directly.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aigw-run
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openai
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: localhost
        port: 11434
