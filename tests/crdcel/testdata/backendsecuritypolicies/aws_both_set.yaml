apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: aws-both-set-policy
  namespace: default
spec:
  type: AWSCredentials
  awsCredentials:
    region: us-east-1
    credentialsFile:
      secretRef:
        name: placeholder
    oidcExchangeToken:
      awsRoleArn: placeholder
      oidc:
        provider:
          issuer: placeholder
        clientID: placeholder
        clientSecret:
          name: placeholder
